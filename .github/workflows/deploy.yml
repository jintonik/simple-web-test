name: Deploy to GitHub Pages

on:
  push:
    branches: [ github-build ]  # ← ваша ветка!

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # необходимо для публикации в gh-pages
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: github-build  # ← ветка, куда пушить сборку
          # ⚠️ GitHub Pages по умолчанию смотрит в корень ВЕТКИ,
          # поэтому содержимое dist/ будет доступно как /simple-web-test/