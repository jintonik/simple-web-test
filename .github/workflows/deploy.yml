name: Deploy to GitHub Pages

on:
  push:
    branches: [ github-build ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci                     # ← добавлено!

      - name: Build
        run: npm run build             # теперь vite доступен

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: github-build
          allow_empty_commit: false
          keep_files: false
          force_orphan: true  # ← вот ключевой параметр!